<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Jogo da Velha</h1>
        
        <div class="status" id="status">Vez do jogador: X</div>
        
        <div class="scoreboard">
            <div class="score-item">
                <span class="score-label x">X</span>
                <span class="score-value" id="scoreX">0</span>
            </div>
            <div class="score-item">
                <span class="score-label draw">Empate</span>
                <span class="score-value" id="scoreDraw">0</span>
            </div>
            <div class="score-item">
                <span class="score-label o">O</span>
                <span class="score-value" id="scoreO">0</span>
            </div>
        </div>
        
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        
        <button class="restart-btn" id="restartBtn">Reiniciar Jogo</button>
        <button class="reset-score-btn" id="resetScoreBtn">Zerar Placar</button>
        <button class="mode-btn" id="modeBtn">Modo: vs Computador 🤖</button>
        <button class="difficulty-btn" id="difficultyBtn">Nível: Impossível 🔴</button>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
